<header class="top">
<div>
<div class="eyebrow">Bem-vindo</div>
<h1>O teu perfil</h1>
</div>
</header>
<p class="lead">Confirma o que já sei de ti. Podes mudar tudo depois.</p>
<form class="form" data-settings>
<section class="card">
<h3>Objetivo</h3>
<div class="opts">
<label class="opt on">
<input type="radio" name="goal" value="saude" checked>
<span>
<strong>Saúde geral</strong>
<small>Força, cardio em zona 2, mobilidade e um HIIT. O plano mais equilibrado.</small>
</span>
</label>
<label class="opt ">
<input type="radio" name="goal" value="musculo" >
<span>
<strong>Criar músculo</strong>
<small>Mais dias de força e mais séries. Menos HIIT, duas corridas.</small>
</span>
</label>
<label class="opt ">
<input type="radio" name="goal" value="gordura" >
<span>
<strong>Queimar gordura</strong>
<small>Circuitos densos e mais zona 2. Força mantida. A alimentação manda.</small>
</span>
</label>
</div>
</section>
<section class="card">
<h3>Semana</h3>
<label class="field">
<span>Dias por semana</span>
<div class="seg">
<button type="button" class="on" data-seg="daysPerWeek" data-val="5">5</button>
<button type="button" class="" data-seg="daysPerWeek" data-val="6">6</button>
<button type="button" class="" data-seg="daysPerWeek" data-val="7">7</button>
</div>
</label>
<label class="field">
<span>Minutos por sessão</span>
<div class="seg">
<button type="button" class="" data-seg="minutes" data-val="25">25</button>
<button type="button" class="on" data-seg="minutes" data-val="30">30</button>
<button type="button" class="" data-seg="minutes" data-val="40">40</button>
<button type="button" class="" data-seg="minutes" data-val="45">45</button>
</div>
</label>
<label class="field">
<span>Corridas por semana</span>
<div class="seg">
<button type="button" class="" data-seg="runsPerWeek" data-val="1">1</button>
<button type="button" class="on" data-seg="runsPerWeek" data-val="2">2</button>
<button type="button" class="" data-seg="runsPerWeek" data-val="3">3</button>
</div>
</label>
</section>
<section class="card">
<h3>Equipamento</h3>
<div class="toggles">
<label class="toggle">
<input type="checkbox" data-eq="dumbbells" checked>
<span>Halteres</span>
</label>
<label class="toggle">
<input type="checkbox" data-eq="board" checked>
<span>Push-up board</span>
</label>
<label class="toggle">
<input type="checkbox" data-eq="rope" checked>
<span>Corda</span>
</label>
<label class="toggle">
<input type="checkbox" data-eq="bars" checked>
<span>Barras street workout</span>
</label>
<label class="toggle">
<input type="checkbox" data-eq="pool" checked>
<span>Piscina</span>
</label>
<label class="toggle">
<input type="checkbox" data-eq="court" checked>
<span>Ringue de basket</span>
</label>
<label class="toggle">
<input type="checkbox" data-eq="chair" checked>
<span>Cadeira / banco / degrau</span>
</label>
</div>
<label class="field">
<span>Peso máximo por halter (kg)</span>
<input type="number" inputmode="numeric" min="2" max="60" step="1" value="12" data-num="dumbbellMaxKg">
</label>
</section>
<section class="card">
<h3>Corpo</h3>
<label class="toggle">
<input type="checkbox" data-bool="kneeSensitive" checked>
<span>Joelhos sensíveis (evita impacto e saltos)</span>
</label>
<label class="toggle">
<input type="checkbox" data-knee-flag >
<span>Joelho a queixar-se esta semana (troca corrida por piscina, pernas por isometrias)</span>
</label>
<label class="field">
<span>Nome</span>
<input type="text" value="João" data-text="name" autocomplete="off">
</label>
</section>
<section class="card">
<h3>Figuras</h3>
<label class="toggle">
<input type="checkbox" data-bool-inv="animate" checked>
<span>Animar o movimento<small>Desliga se preferires as figuras paradas</small>
</span>
</label>
</section>
<button type="button" class="btn btn-primary btn-big" data-finish-onboarding>Gerar o meu plano</button>
</form>
